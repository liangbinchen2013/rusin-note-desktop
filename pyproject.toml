[project]
name = "rusin-note-local"
version = "0.1.0"
description = "本地优先的 rusin-note 笔记应用：本地 SQLite 存储 + 云端犇犇/笔记同步"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0,<4.0",
    "flask-wtf>=1.2,<2.0",
    "flask-limiter>=3.5,<4.0",
    "flask-caching>=2.0,<3.0",
    "waitress>=3.0,<4.0",
    "markdown>=3.6,<4.0",
    "pymdown-extensions>=10.0,<12.0",
    "pygments>=2.15,<3.0",
    "bleach>=6.0,<6.3",
    "cryptography>=42,<50",
    "requests>=2.32,<3.0",
    "beautifulsoup4>=4.12,<5.0",
    "pywebview>=6.0,<7.0; sys_platform != 'linux'",
    "pywebview[gtk]>=6.0,<7.0; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "pyinstaller>=6.0,<7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
